<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Grader 3000</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
    <h1>Grader 3000</h1>
    <section>
        <h2>Übungen</h2>
        <div id="exercise-container"></div>
    </section>
    <section>
        <h2>Klausur</h2>
        <div id="exam-container"></div>
    </section>
    <section>
        <h2>Anwesenheit</h2>
        <div id="attendance-container"></div>
    </section>
    <section id="result-box">
        <h2>Ergebnis</h2>
        <p id="exercise-result">Übungsnote: 0%</p>
        <p id="exam-result">Klausurnote: 0%</p>
        <p id="final-result">Gesamtnote: 0%</p>
        <p id="grade-result">Note: Nicht Genügend</p>
        <p id="reason-result"></p>
    </section>
</main>
<script type="module" src="./controller.js"></script>
</body>
</html>
